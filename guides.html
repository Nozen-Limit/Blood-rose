  <!--
    SCRIPTS — order matters.
      1. utils.js   creates the shared BR object everything else reads
      2. render.js  shared element builders
      3. data/*.js  ALL content data loads on EVERY page, not just the page
                    that displays it, so site-wide search can index the whole
                    site from wherever you happen to be. Each file is tiny.
      4. renderers  only this page has the mount points these look for; the
                    others would find nothing, so they are not loaded here.
      5. search     search-index.js (sections) then search-sources.js (the
                    real content) then search.js, which reads both.
      6. the rest   these SCAN the finished DOM, so they must come last —
                    reveal.js in particular would miss any generated card
                    and leave it permanently invisible.
  -->
  <script defer src="js/utils.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/supabase-client.js"></script>
